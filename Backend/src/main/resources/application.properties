spring.application.name=CompeteCode

# PostgreSQL / Neon
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# Judge0
judge0.api.url=${JUDGE0_URL:https://judge0-ce.p.rapidapi.com}
judge0.api.key=${JUDGE0_KEY}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://compete-code.vercel.app}

# Battle settings
battle.default-duration-minutes=30
battle.max-participants=50

server.port=8080