spring.application.name=CompetCode

# PostgreSQL (Loaded via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# HikariCP Connection Pool (tuned for cloud/Neon pooler)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JWT Authentication (Environment Variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# Google Gemini AI (Environment Variables)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}

# Judge0 Code Execution (Open Public Instance by default, no subscription required)
judge0.api.url=${JUDGE0_URL:https://ce.judge0.com}
judge0.api.key=${JUDGE0_KEY:}

# CORS Allowed Origins (Environment Variables)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost,https://compete-code.vercel.app,https://*.vercel.app}

# Battle Settings
battle.default-duration-minutes=${BATTLE_DEFAULT_DURATION_MINUTES:30}
battle.max-participants=${BATTLE_MAX_PARTICIPANTS:50}

# Server Port (Render / Cloud Environment)
server.port=${PORT:8080}
