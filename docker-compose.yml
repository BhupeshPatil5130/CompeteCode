services:
  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: competcode-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JUDGE0_URL: ${JUDGE0_URL:-https://judge0-ce.p.rapidapi.com}
      JUDGE0_KEY: ${JUDGE0_KEY}
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://frontend,http://localhost:80
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - competcode-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: competcode-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - competcode-network

networks:
  competcode-network:
    driver: bridge
